<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Aqiqah | Zayed Elshan Haidarrahman</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f7f5f0;
  color: #4a4a4a;
  text-align: center;
}

/* OVERLAY */
#overlay {
  position: fixed;
  inset: 0;
  background: #f7f5f0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#overlay button {
  padding: 16px 30px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  background: #b89b5e;
  color: #fff;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
}

/* CONTENT */
section { padding: 50px 16px; }

.cover {
  min-height: 100vh;
  background: url('cover.png') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
}

.cover h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: #5b4b3a;
  background: rgba(255,255,255,0.88);
  padding: 16px 22px;
  border-radius: 18px;
}

.card {
  background: #ffffff;
  border-radius: 20px;
  padding: 28px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

img.section-img {
  width: 100%;
  max-width: 420px;
  border-radius: 22px;
  margin-bottom: 24px;
}

.btn {
  display: inline-block;
  margin-top: 18px;
  padding: 12px 26px;
  background: #b89b5e;
  color: #fff;
  text-decoration: none;
  border-radius: 30px;
  font-size: 14px;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

.countdown div {
  background: #f0ece3;
  border-radius: 14px;
  padding: 12px;
  min-width: 70px;
}

.countdown span {
  font-size: 22px;
  font-weight: bold;
  color: #5b4b3a;
}

footer {
  padding: 50px 16px;
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<body style="
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
  font-family:Poppins,sans-serif;
  background:#f7f5f0;
  color:#4a4a4a;
  text-align:center;
">
  <div style="
    background:#fff;
    padding:32px;
    border-radius:20px;
    max-width:420px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
  ">
    <h2 style="font-family:'Playfair Display',serif;">
      Acara Telah Selesai
    </h2>
    <p style="margin-top:12px;">
      Terima kasih atas doa dan perhatian  
      Bapak/Ibu/Saudara/i.
    </p>
    <p style="margin-top:12px;">
      Semoga Allah SWT membalas dengan  
      kebaikan dan keberkahan.
    </p>
    <p style="margin-top:16px;">
      Wassalamu’alaikum Warahmatullahi Wabarakatuh
    </p>
  </div>
</body>
</html>
